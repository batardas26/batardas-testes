<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TESTES — Ficha do artigo — Batardas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css"><link rel="icon" href="img/logo.png" type="image/png">
</head>
<body>
<aside class="ambiente-testes">BATARDAS · TESTES — R3.2.3</aside>
<header><div><button class="secundario" onclick="history.length>1?history.back():location.href='inicio.html'">Voltar</button><h1 style="margin:0">Ficha do artigo</h1></div><div><span class="utilizador" id="nomeUtilizador"></span><button class="secundario" onclick="terminarSessao()">Sair</button></div></header>
<main>
  <section class="cartao artigo-cabecalho-r31"><div><p class="mono" id="artigoRef">—</p><h2 id="artigoNome">A carregar…</h2><p id="artigoMeta" class="texto-suave"></p></div><a class="secundario" href="modelo-artigos-lotes.html">Configurar artigo</a></section>
  <section class="cartao"><h2>Stock por etapa</h2><p class="texto-suave">As etapas não são somadas entre si: matéria-prima, produto interno e produto comercial representam momentos diferentes do processo.</p><div class="etapas-stock-r31" id="stockEtapas"></div></section>
  <section class="cartao"><h2>Movimentos e lotes</h2><div class="linha-form"><select id="filtroArmazem"><option value="">Todos os armazéns</option></select><select id="filtroEtapa"><option value="">Todas as etapas</option><option value="fornecedor">Fornecedor</option><option value="sem_lote">Sem lote</option><option value="interno">Interno</option><option value="comercial">Comercial</option></select></div><div id="tabelaStock"></div></section>
  <section class="cartao"><h2>Rastreabilidade</h2><div class="linha-form"><input id="numeroRastreio" placeholder="Lote de fornecedor, interno ou comercial"><button id="btnRastrear">Pesquisar</button></div><button id="btnPdfRastreio" class="secundario">Exportar PDF</button><div id="resultadoRastreio" style="margin-top:14px"></div></section>
</main>
<script src="js/supabaseClient.js"></script><script src="js/rastreabilidade-r31.js"></script>
<script>
let linhasStockR31=[];
async function iniciarFicha(){
 const session=await exigirSessao();if(!session)return;const perfil=await obterPerfil(session.user.id);if(!perfil)return;const rotaPendente=rotaPendentePrimeiroAcesso(perfil,session.user);if(rotaPendente){location.href=rotaPendente;return;}if(!await verificarBackendR323())return;await renderizarCabecalhoUtilizador(perfil,session.user.id);
 const id=new URLSearchParams(location.search).get("id");if(!id){document.getElementById("artigoNome").textContent="Artigo não indicado";return;}
 const artigoResposta=supabaseClient.from("artigos").select("artigo_id,ref_primavera,designacao,tipo_produto,unidade_stock,controla_lote_fornecedor,stock_minimo,stock_alvo").eq("artigo_id",id).single();
 const stockResposta=await supabaseClient.from("stock_artigo_r323").select("*").eq("artigo_id",id);
 const [{data:a,error},{data:stock}]=await Promise.all([artigoResposta,Promise.resolve(stockResposta)]);
 if(error){document.getElementById("artigoNome").textContent=traduzirErro(error.message);return;}
 if(stockResposta.error){document.getElementById("stockEtapas").innerHTML=`<p class="erro">Não foi possível confirmar o stock reservado e livre. ${escaparHtml(traduzirErro(stockResposta.error.message))}</p>`;return;}
 document.getElementById("artigoRef").textContent=a.ref_primavera;document.getElementById("artigoNome").textContent=a.designacao;document.getElementById("artigoMeta").textContent=`${a.tipo_produto} · stock em ${formatarUnidadeStock(a.unidade_stock)} · ${a.controla_lote_fornecedor?"com lote de fornecedor":"sem lote de fornecedor"} · mínimo ${a.stock_minimo??"—"} · alvo ${a.stock_alvo??"—"}`;
 linhasStockR31=stock||[];const armazens=[...new Set(linhasStockR31.map(x=>x.armazem).filter(Boolean))].sort();document.getElementById("filtroArmazem").innerHTML+=[...armazens].map(x=>`<option>${escaparHtml(x)}</option>`).join("");renderStock();
 const lote=new URLSearchParams(location.search).get("lote");if(lote){document.getElementById("numeroRastreio").value=lote;document.getElementById("btnRastrear").click();}
}
function renderStock(){const arm=document.getElementById("filtroArmazem").value,etapa=document.getElementById("filtroEtapa").value;const l=linhasStockR31.filter(x=>(!arm||x.armazem===arm)&&(!etapa||x.etapa===etapa));const grupos=Object.groupBy?Object.groupBy(l,x=>x.etapa):l.reduce((r,x)=>((r[x.etapa]??=[]).push(x),r),{});document.getElementById("stockEtapas").innerHTML=Object.entries(grupos).map(([k,v])=>{const fisico=v.reduce((s,x)=>s+Number(x.disponivel),0),reservado=v.reduce((s,x)=>s+Number(x.reservado),0),bloqueado=v.reduce((s,x)=>s+Number(x.bloqueado),0);return `<div class="etapa-stock-r31"><strong>${escaparHtml(k)}</strong><p>${fisico} físico · ${Math.max(0,fisico-reservado-bloqueado)} livre · ${bloqueado} bloqueado · ${reservado} reservado</p></div>`;}).join("")||'<p class="texto-suave">Sem stock nesta seleção.</p>';document.getElementById("tabelaStock").innerHTML=`<table><thead><tr><th>Etapa</th><th>Lote</th><th>Armazém</th><th>Recebido/produzido</th><th>Consumido</th><th>Stock físico</th><th>Reservado</th><th>Bloqueado</th><th>Livre</th></tr></thead><tbody>${l.map(x=>`<tr><td>${escaparHtml(x.etapa)}</td><td>${x.numero_lote?`<button class="link-lote-r31" data-lote="${escaparHtml(x.numero_lote)}">${escaparHtml(x.numero_lote)}</button>`:"—"}</td><td>${escaparHtml(x.armazem||"—")}</td><td>${x.quantidade_recebida} ${escaparHtml(x.unidade)}</td><td>${x.consumido}</td><td>${x.disponivel}</td><td>${x.reservado}</td><td>${x.bloqueado}</td><td>${Math.max(0,Number(x.disponivel)-Number(x.reservado)-Number(x.bloqueado))}</td></tr>`).join("")}</tbody></table>`;document.querySelectorAll(".link-lote-r31").forEach(b=>b.onclick=()=>{document.getElementById("numeroRastreio").value=b.dataset.lote;document.getElementById("btnRastrear").click();document.getElementById("numeroRastreio").scrollIntoView({behavior:"smooth"});});}
document.getElementById("filtroArmazem").onchange=renderStock;document.getElementById("filtroEtapa").onchange=renderStock;document.getElementById("btnRastrear").onclick=()=>pesquisarRastreioR31(document.getElementById("numeroRastreio").value,document.getElementById("resultadoRastreio"));document.getElementById("btnPdfRastreio").onclick=()=>exportarRastreioPdfR31();iniciarFicha();
</script></body></html>
